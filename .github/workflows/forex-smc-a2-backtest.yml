name: Forex SMC A2 and A3 external backtests

on:
  push:
    branches:
      - a2-audit-backtest
    paths:
      - backtest/run-trigger.txt
  workflow_dispatch:

concurrency:
  group: forex-smc-a2-a3-backtest-reuse-dataset
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  eurusd-m5-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYNE_WORK_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified EURUSD feed from run 10
        uses: actions/download-artifact@v4
        with:
          name: forex-smc-a2-a3-eurusd-m5-2022-present
          repository: ${{ github.repository }}
          run-id: 41323005218
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Install PyneCore
        run: python -m pip install --upgrade pip && python -m pip install "pynesys-pynecore[cli]"

      - name: Run A2 baseline port
        run: pyne run backtest/forex_smc_engine_a2_pyne.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run A3 risk-sized candidate port
        run: pyne run backtest/forex_smc_engine_a3_pyne.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run A2 zero-commission cost sensitivity
        run: pyne run backtest/forex_smc_engine_a2_pyne_zero_commission.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run A3 zero-commission cost sensitivity
        run: pyne run backtest/forex_smc_engine_a3_pyne_zero_commission.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run raw BOS diagnostic without filters
        run: pyne run backtest/forex_smc_engine_debug_raw_bos.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run BOS diagnostic with HTF gate only
        run: pyne run backtest/forex_smc_engine_debug_htf_only.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run score 50 diagnostic without HTF gate
        run: pyne run backtest/forex_smc_engine_debug_score_no_htf_gate.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: Run score 35 diagnostic without HTF gate
        run: pyne run backtest/forex_smc_engine_debug_score35_no_htf_gate.py data/EURUSD_5m_mid.ohlcv --security "240=EURUSD_240"

      - name: List generated reports
        run: find . -type f \( -name '*_strat.csv' -o -name '*_trade.csv' \) -print

      - name: Upload reproducible data and backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: forex-smc-a2-a3-eurusd-m5-2022-present
          path: |
            data/EURUSD_5m_bid.csv
            data/EURUSD_5m_ask.csv
            data/EURUSD_5m_mid.csv
            data/EURUSD_5m_mid.ohlcv
            data/EURUSD_240.ohlcv
            data/EURUSD_spread_summary.json
            data/*.toml
            **/*_strat.csv
            **/*_trade.csv
          if-no-files-found: error
